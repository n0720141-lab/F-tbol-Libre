  </g>

  <!-- Telemundo Wordmark -->
  <text x="82" y="44" fill="#0f172a" font-family="Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5">TELEMUNDO</text>
  <text x="82" y="58" fill="#ef4444" font-family="Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="3">DEPORTES</text>
</svg>
