<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Green Ring (matching Image 2) -->
  <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#16a34a" stroke-width="9"/>

  <!-- Clip path to keep ball details inside the white circle -->
  <defs>
    <clipPath id="ballClip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ballClip)">
    <!-- Ball Seam Lines -->
    <!-- From center pentagon to 5 outer patches -->
    <line x1="50" y1="36" x2="50" y2="20" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="63.3" y1="45.7" x2="77" y2="39" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58.2" y1="61.3" x2="70" y2="72" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="41.8" y1="61.3" x2="30" y2="72" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36.7" y1="45.7" x2="23" y2="39" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Connecting lines between outer patches -->
    <line x1="50" y1="20" x2="23" y2="39" stroke="#111827" stroke-width="2"/>
    <line x1="50" y1="20" x2="77" y2="39" stroke="#111827" stroke-width="2"/>
    <line x1="77" y1="39" x2="70" y2="72" stroke="#111827" stroke-width="2"/>
    <line x1="70" y1="72" x2="30" y2="72" stroke="#111827" stroke-width="2"/>
    <line x1="30" y1="72" x2="23" y2="39" stroke="#111827" stroke-width="2"/>

    <!-- Center Black Pentagon -->
    <polygon points="50,36 63.3,45.7 58.2,61.3 41.8,61.3 36.7,45.7" fill="#111827"/>

    <!-- Top Outer Patch -->
    <polygon points="50,20 40,12 43,4 57,4 60,12" fill="#111827"/>

    <!-- Top Right Outer Patch -->
    <polygon points="77,39 88,32 94,40 91,52 83,49" fill="#111827"/>

    <!-- Bottom Right Outer Patch -->
    <polygon points="70,72 82,73 85,84 76,91 67,83" fill="#111827"/>

    <!-- Bottom Left Outer Patch -->
    <polygon points="30,72 33,83 24,91 15,84 18,73" fill="#111827"/>

    <!-- Top Left Outer Patch -->
    <polygon points="23,39 17,49 9,52 6,40 12,32" fill="#111827"/>
  </g>
</svg>
